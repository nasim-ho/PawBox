<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1213 570" fill="none">
  <style>
    .draw {
      stroke: #5C9E4A;
      stroke-width: 14;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      vector-effect: non-scaling-stroke;
      stroke-dasharray: 1;
      stroke-dashoffset: 1;
      animation: draw-arrow 1.8s cubic-bezier(.65,0,.35,1) infinite;
    }

    @keyframes draw-arrow {
      to { stroke-dashoffset: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      .draw {
        animation: none;
        stroke-dashoffset: 0;
      }
    }
  </style>

